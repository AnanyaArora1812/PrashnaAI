# PrashnaAI Configuration

# RAG settings
embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
chunk_size: 1200        # characters per chunk
chunk_overlap: 250      # characters of overlap between consecutive chunks
top_k: 8                 # number of chunks retrieved per query
min_chunk_length: 40     # discard chunks shorter than this (filters OCR noise fragments)

# LLaMA settings (Phase 8+)
llama_model: "meta-llama/Llama-3.2-1B-Instruct"  # placeholder, small model for CPU testing
max_new_tokens: 768
temperature: 0.3

# LoRA settings (used later, Phase 9+)
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
output_dir: "checkpoints/lora_adapter"